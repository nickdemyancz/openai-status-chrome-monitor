<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenAI Status</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">
  <main class="popup-shell">
    <header class="popup-header">
      <div class="heading">
        <div class="eyebrow">Мониторинг служб</div>
        <h1>OpenAI Status</h1>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-button" id="refresh" title="Обновить сейчас" aria-label="Обновить сейчас">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.35 5.65M20 4v7h-7"/></svg>
        </button>
        <button type="button" class="icon-button" id="settings" title="Настройки" aria-label="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.07-1.9 1.9-.07-.06A1.7 1.7 0 0 0 16 18.45a1.7 1.7 0 0 0-1 1.55V21h-6v-1a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.07.06-1.9-1.9.06-.07A1.7 1.7 0 0 0 4.55 15 1.7 1.7 0 0 0 3 14H2v-4h1a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.07 1.9-1.9.07.06A1.7 1.7 0 0 0 8 5.55 1.7 1.7 0 0 0 9 4V3h6v1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.07-.06 1.9 1.9-.06.07A1.7 1.7 0 0 0 19.45 9 1.7 1.7 0 0 0 21 10h1v4h-1A1.7 1.7 0 0 0 19.4 15Z" transform="translate(0 0) scale(0.91) translate(1.2 1.2)"/></svg>
        </button>
      </div>
    </header>

    <section class="overview" aria-label="Общий статус OpenAI">
      <span class="status-dot large gray" id="overall-dot" aria-hidden="true"></span>
      <div class="overview-copy">
        <div class="overview-label">Общий статус OpenAI</div>
        <div class="overview-status" id="overall-text">Ожидание проверки</div>
      </div>
    </section>

    <div id="warning" class="warning" hidden></div>
    <div class="section-topline">
      <span>Выбранные службы</span>
      <span id="selection-count"></span>
    </div>
    <div class="service-list" id="services" aria-live="polite"></div>

    <footer class="popup-footer">
      <span id="checked-at">Не проверялось</span>
      <a href="https://status.openai.com/" target="_blank" rel="noopener noreferrer">Источник ↗</a>
    </footer>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
